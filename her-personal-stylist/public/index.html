<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Her Personal Stylist</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="screen" id="introScreen">
  <p class="intro-text display">Preparing something made only for you&hellip;</p>
</div>

<div class="screen" id="loginScreen" style="display: none;">
  <div class="card">
    <h1 class="title">Welcome back</h1>
    <p class="subtitle">This space is just for you.</p>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          inputmode="text"
          required
        />
        <button type="button" class="toggle-visibility" id="toggleVisibility" aria-label="Show password">
          Show
        </button>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Enter</button>
      <p class="error-message" id="errorMessage"></p>
    </form>
  </div>
</div>

<script>
  // Short, deliberate delay so the intro line has a moment to breathe
  // before the login card appears. Skippable — nobody has to sit through
  // an animation to get to the app.
  const intro = document.getElementById('introScreen');
  const login = document.getElementById('loginScreen');

  function showLogin() {
    intro.style.display = 'none';
    login.style.display = 'flex';
  }
  const introTimer = setTimeout(showLogin, 1600);
  intro.addEventListener('click', () => {
    clearTimeout(introTimer);
    showLogin();
  });

  // Password visibility toggle
  const pwInput = document.getElementById('password');
  const toggleBtn = document.getElementById('toggleVisibility');
  toggleBtn.addEventListener('click', () => {
    const isPassword = pwInput.type === 'password';
    pwInput.type = isPassword ? 'text' : 'password';
    toggleBtn.textContent = isPassword ? 'Hide' : 'Show';
  });

  // Login submit
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const errorMessage = document.getElementById('errorMessage');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMessage.textContent = '';
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>Checking&hellip;';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwInput.value }),
      });
      const data = await res.json();

      if (res.ok && data.success) {
        window.location.href = '/dashboard.html';
        return;
      }

      errorMessage.textContent = data.error || 'Something went wrong. Please try again.';
    } catch (err) {
      errorMessage.textContent = 'Could not reach the server. Check your connection and try again.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enter';
    }
  });
</script>

</body>
</html>
