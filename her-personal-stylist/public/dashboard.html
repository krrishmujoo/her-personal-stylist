<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Her Personal Stylist</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="top-nav">
  <span class="brand">Her Personal Stylist</span>
  <button class="logout-link" id="logoutBtn">Log out</button>
</nav>

<div class="dashboard-wrap">
  <h1 class="greeting">Hi, Divya.</h1>
  <p class="greeting-sub">This is yours now. Everything else is still being built for you.</p>

  <div class="coming-soon">
    Outfit suggestions, makeup matching, skincare guidance, your wardrobe, and saved looks
    all arrive in the next phases. For now — welcome in.
  </div>
</div>

<script src="/js/guard.js"></script>
<script>
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/index.html';
  });
</script>

</body>
</html>
